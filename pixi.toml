[workspace]
authors = ["snsinfu <snsinfu@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "tadclust"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "pytest -q tests"
lint = "ruff check src tests"
format = "ruff format src tests"
format-check = "ruff format --check src tests"
typecheck = "pyright src tests"

[dependencies]
python = "3.12.*"
numpy = "2.*"
polars = "1.*"
pyarrow = "*"
scipy = ">=1.11,<2"
h5py = ">=3.10,<4"
scikit-learn = ">=1.5,<2"
cooler = ">=0.10.4,<0.11"
threadpoolctl = ">=3"

[feature.dev.dependencies]
pytest = "*"
pyright = "*"
ruff = "*"
pandas = "*"

[environments]
default = { features = ["dev"], solve-group = "default" }

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"
PATH = "$PIXI_PROJECT_ROOT/bin:$PATH"
